[package]
name = "rmathrs"
version = "0.1.0"
edition = "2021"
authors = ["Rushikesh <rushike.ab1@gmail.com>"]
description = "Arbitrary precision arithmetic and math library for multi-target environments (macOS, Windows, Linux, WebAssembly)"
repository = "https://github.com/rushike/rmathrs.git"
license = "MIT"
keywords = ["math", "bignumber", "decimal", "wasm"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
cfg-if = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1"

# Gated: only pulled when feature "malachite" is enabled
[dependencies.malachite]
version = "0.14"
optional = true
default-features = false
features = ["naturals_and_integers", "rationals", "floats"]

[features]
default = ["malachite"]

# Target-specific dependencies: WebAssembly
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["console"] }
serde-wasm-bindgen = "0.6"
console_error_panic_hook = "0.1"
getrandom = { version = "0.2", features = ["js"] }

# Target-specific dependencies: Windows
[target.'cfg(windows)'.dependencies]

# Target-specific dependencies: macOS / Unix
[target.'cfg(unix)'.dependencies]

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

